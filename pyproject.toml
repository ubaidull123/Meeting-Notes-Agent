[project]
name = "meeting-notes-agent"
version = "0.1.0"
description = "Meeting notes agent with transcription, summarization, and redaction"
readme = "README.md"
authors = [
    { name = "Ubaidullah Saeed", email = "ubaidullahsaeed2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.3.15",
    "langchain-core>=1.5.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.4.3",
    "langchain-openrouter>=0.2.7",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pydantic>=2.12.5",
]

[project.scripts]
meeting-notes-agent = "meeting_notes_agent.graph:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
meeting-notes-agent = { path = "src/meeting_notes_agent", editable = true }
