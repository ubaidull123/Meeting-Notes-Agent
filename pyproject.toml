[project]
name = "meeting-notes-agent"
version = "0.1.0"
description = "Meeting notes agent with transcription, summarization, and redaction"
readme = "README.md"
authors = [
    { name = "Ubaidullah Saeed", email = "ubaidullahsaeed2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "bcrypt>=4.0.0",
    "cryptography>=42.0.0",
    "dotenv>=0.9.9",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langchain>=1.3.15",
    "langchain-core>=1.5.4",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.4.3",
    "langchain-openrouter>=0.2.7",
    "langchain-postgres>=0.0.17",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.10.18",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2>=2.9.12",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "python-json-logger>=2.0.7",
    "python-multipart>=0.0.9",
    "resend>=2.36.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
meeting-notes-agent = "meeting_notes_agent.main:main"
meeting-notes-api = "meeting_notes_agent.api.main:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
meeting-notes-agent = { path = "src/meeting_notes_agent", editable = true }

[dependency-groups]
dev = [
    "langgraph-cli>=0.4.31",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "faker>=25.0.0",
]
test = [
    "aiosqlite>=0.20.0",
]
